server.servlet.context-path=/xavacrm
server.tomcat.additional-tld-skip-patterns=htmlunit-*.jar,jetty-*.jar

# MySQL datasource (antes en src/main/webapp/META-INF/context.xml)
spring.datasource.username=root
spring.datasource.password=openxava
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.url=jdbc:mysql://localhost:3306/XavaCRM?serverTimezone=GMT%2B2
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Logging (equivalente al antiguo javaLoggingLevel=FINE de xava.properties)
logging.level.org.openxava=DEBUG
